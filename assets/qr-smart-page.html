<html lang="pt-BR">
<head>

<style>
*{box-sizing:border-box}html{min-height:100%;scroll-behavior:smooth}body{margin:0;font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}button,a{font:inherit}button{cursor:pointer}a{color:inherit}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}[hidden]{display:none!important}
main{min-height:100svh;position:relative;isolation:isolate;display:flex;flex-direction:column;overflow:hidden;color:var(--ink);background:var(--bg);transition:background .3s ease,color .3s ease}
main:before{content:"";pointer-events:none;position:absolute;z-index:-1;width:min(80vw,490px);height:300px;left:50%;top:-240px;transform:translateX(-50%);background:var(--accent);filter:blur(110px);opacity:.21}
.shell{flex:1;width:min(100% - 40px,460px);margin:0 auto;padding:42px 0 20px;text-align:center}
.identity{display:flex;align-items:center;flex-direction:column}
.logo{display:grid;place-items:center;overflow:hidden;width:98px;height:98px;border:1px solid var(--line);border-radius:26px;background:var(--card);box-shadow:0 16px 37px #00000013}
.logo img{width:100%;height:100%;object-fit:contain}.logo span{font-size:32px;font-weight:750;letter-spacing:-.08em;color:var(--accent)}
.business-type{font-size:10px;text-transform:uppercase;letter-spacing:.13em;font-weight:750;opacity:.62;margin:19px 0 8px}
.business-name{font-size:clamp(27px,7vw,35px);line-height:1.13;letter-spacing:-.045em;margin:0 0 10px;font-weight:780;overflow-wrap:anywhere}
.description{font-size:13.5px;line-height:1.65;color:var(--muted);max-width:340px;margin:0 auto 23px;white-space:pre-line}
.cover{display:none;width:100%;height:150px;object-fit:cover;border:1px solid var(--line);border-radius:16px;margin-bottom:17px}.cover.has-photo{display:block}
.actions{display:flex;flex-direction:column;gap:10px;width:100%;margin:20px auto 0}
.action{position:relative;display:flex;align-items:center;justify-content:center;text-align:center;width:100%;min-height:54px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);color:var(--ink);font-size:14px;font-weight:730;letter-spacing:-.013em;text-decoration:none;padding:13px 16px;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;overflow-wrap:anywhere}
.action:first-child{background:var(--accent);color:var(--accent-text);border-color:transparent}
.action:active{transform:scale(.987)}.action:hover{transform:translateY(-2px);box-shadow:0 12px 27px #00000010}
.footer{margin:36px auto 14px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--muted);font-size:10px}
.footer .brand{font-size:10px;letter-spacing:.07em;font-weight:750}
.admin-link{display:inline-flex;background:none;border:0;color:var(--muted);font-size:11px;text-decoration:underline;text-underline-offset:4px;padding:8px}
.preview-toast{position:fixed;z-index:20;bottom:20px;left:50%;transform:translateX(-50%);width:min(360px,calc(100% - 36px));background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:0 20px 50px #0003;padding:13px 17px;text-align:center;font-size:12px}
.pix-modal{border:1px solid var(--line);border-radius:23px;max-width:min(440px,calc(100% - 30px));width:100%;padding:0;color:var(--ink);background:var(--card);box-shadow:0 30px 85px #0005}.pix-modal::backdrop{background:#081a31ad;backdrop-filter:blur(5px)}
.pix-inner{padding:27px 23px}.pix-head{display:flex;align-items:center;justify-content:space-between}.pix-head strong{font-size:20px;letter-spacing:-.035em}.pix-close{width:30px;height:30px;border:0;border-radius:50%;background:var(--bg);font-size:20px;color:var(--ink)}
.pix-inner p{font-size:12px;line-height:1.5;color:var(--muted)}.pix-value{padding:15px;border:1px solid var(--line);border-radius:11px;margin:15px 0;overflow-wrap:anywhere;font-size:12px;line-height:1.65;background:var(--bg);max-height:135px;overflow:auto}
.pix-copy{width:100%;min-height:49px;border:0;border-radius:12px;color:var(--accent-text);background:var(--accent);font-size:13px;font-weight:760}.pix-status{font-size:12px;min-height:16px;margin-top:13px;color:var(--muted)}
[data-theme="clean"]{--bg:#f8fafc;--ink:#182d41;--muted:#6b7d8c;--card:#fff;--line:#dce5ea;--radius:15px}
[data-theme="glass"]{--bg:#0b1b30;--ink:#f2f6ff;--muted:#a4b7ca;--card:#142a42;--line:#ffffff27;--radius:19px}
[data-theme="editorial"]{--bg:#fbf6ef;--ink:#332d2a;--muted:#84776d;--card:#fffdfa;--line:#e7dfd5;--radius:8px}
[data-theme="editorial"] .business-name{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:38px;letter-spacing:-.05em}
[data-theme="editorial"] .logo{border-radius:50%}
[data-theme="editorial"] .action{letter-spacing:.01em}
[data-theme="glass"] .action{backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 #ffffff13}
[data-theme="glass"] main:before{opacity:.3}
@media(max-width:430px){.shell{padding-top:32px;width:calc(100% - 34px)}.logo{width:86px;height:86px}.actions{gap:9px}.action{min-height:51px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}

/* WillAI Minimal 2026 — um visual neutro para qualquer segmento. */
:root{--secondary:#9bc7cd}
main{background:var(--bg)!important;min-height:100svh}
main:before{left:-140px;top:-175px;width:390px;height:340px;transform:none;filter:blur(88px);opacity:.16;background:var(--accent);animation:qr-ambient 18s ease-in-out infinite alternate}
main:after{content:"";position:absolute;right:-170px;top:130px;width:390px;height:350px;border-radius:50%;filter:blur(95px);opacity:.16;z-index:-1;pointer-events:none;background:var(--secondary);animation:qr-ambient 20s ease-in-out infinite alternate-reverse}
.shell{display:flex;flex-direction:column;min-height:100svh;width:min(100% - 40px,440px);padding:clamp(44px,9vh,78px) 0 25px}
.identity{animation:qr-rise .65s cubic-bezier(.22,1,.36,1) both}
.logo{margin:0 auto 23px;width:90px;height:90px;border-radius:19px;box-shadow:0 14px 34px #0a233b13}
.logo span{color:var(--accent)}
.business-type{margin:0 0 9px;opacity:1;color:var(--accent);font-size:10px;letter-spacing:.17em}
.business-type:empty{display:none}
.business-name{margin:0;font:770 clamp(29px,7vw,38px)/1.15 Inter,"Segoe UI",system-ui,sans-serif;letter-spacing:-.052em}
.description{margin:13px auto 0;max-width:330px;line-height:1.6;overflow-wrap:anywhere}
.identity:after{content:"";display:block;width:40px;height:2px;margin:25px auto 0;background:var(--accent);opacity:.7;border-radius:3px}
.cover,.cover.has-photo{display:none!important}
.actions{display:grid;gap:10px;margin:28px auto 32px}
.action{display:grid;grid-template-columns:38px minmax(0,1fr);justify-content:stretch;text-align:left;align-items:center;gap:14px;min-height:60px;padding:10px 16px 10px 13px;border-radius:13px;background:var(--card);border:1px solid var(--line);color:var(--ink);font-size:14px;font-weight:690;box-shadow:0 5px 22px #102f4410;animation:qr-rise .54s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(.08s + var(--qr-order,0)*55ms);transition:transform .2s,border-color .2s,box-shadow .2s}
.action:first-child{background:color-mix(in srgb,var(--accent) 7%,var(--card));color:var(--ink);border-color:color-mix(in srgb,var(--accent) 27%,var(--line))}
.action:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 12px 28px #102f4420}
.action-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;background:var(--chip,#edf3f6);color:var(--accent)}
.action-icon svg{width:22px;height:22px;display:block}
.action:first-child .action-icon{background:var(--accent);color:#fff}
.action-label{overflow-wrap:anywhere;min-width:0}
.footer{margin:auto auto 12px;gap:8px}
.footer .brand{letter-spacing:.02em;font-weight:650}
.admin-link{font-size:10px;text-decoration-color:transparent}
.admin-link:hover{text-decoration-color:currentColor}
.pix-modal{border-radius:17px}
@keyframes qr-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes qr-ambient{to{transform:translate3d(35px,25px,0) scale(1.12)}}
@media(max-width:430px){.shell{width:calc(100% - 34px);padding-top:38px}.logo{width:82px;height:82px}.actions{gap:9px;margin-top:24px}.action{min-height:56px}}
@media(prefers-reduced-motion:reduce){main:before,main:after,.identity,.action{animation:none!important}}
</style>
</head>
<body>
<main data-theme="clean" id="smartRoot">
 <div class="shell">
  <section class="identity">
   <div class="logo"><img id="smartLogo" alt="Logo da empresa" hidden><span id="smartInitial">W</span></div>
   <span class="business-type" id="smartCategory"></span>
   <h1 class="business-name" id="smartName">Seu negócio</h1>
   <p class="description" id="smartDescription"></p>
  </section>
  <img id="smartCover" class="cover" alt="Imagem do estabelecimento" hidden>
  <div class="actions" id="smartActions"></div>
  <footer class="footer"><span class="brand">Criado por WillAI · by ELIX</span><button type="button" class="admin-link" id="smartLogin">Administrar minha plaquinha</button></footer>
 </div>
</main>
<dialog id="pixModal" class="pix-modal" aria-labelledby="pixTitle"><div class="pix-inner"><div class="pix-head"><strong id="pixTitle">Pagar com Pix</strong><button class="pix-close" id="pixClose" type="button" aria-label="Fechar">×</button></div><p id="pixExplanation">Copie os dados e abra o aplicativo do seu banco para pagar.</p><div class="pix-value" id="pixValue"></div><button type="button" class="pix-copy" id="pixCopy">Copiar Pix</button><div id="pixStatus" class="pix-status" role="status"></div></div></dialog>
<div id="toast" class="preview-toast" role="status" hidden></div>
<script>
(()=>{'use strict';
 const root=document.getElementById('smartRoot'),$=id=>document.getElementById(id);
 const preview=new URLSearchParams(location.search).has('preview');
 let config={},toastId=0,pixToCopy='';
 const safeUrl=value=>{try{const u=new URL(String(value||''));return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}};
 const color=(x,f)=>/^#[0-9a-f]{6}$/i.test(x||'')?x:f;
 const phone=v=>String(v||'').replace(/\D/g,'').slice(0,15);
 const wa=v=>{const value=String(v||'').trim();if(/^https?:\/\//i.test(value))return safeUrl(value);const p=phone(value);if(p.length===10||p.length===11)return 'https://wa.me/55'+p;if(p.length>=12&&p.length<=15)return 'https://wa.me/'+p;return ''};
 const showToast=t=>{const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toastId);toastId=setTimeout(()=>el.hidden=true,2900)};
 function external(link,label){
  if(!link){showToast('Este contato ainda não foi configurado.');return}
  if(preview){showToast('Prévia: abrir '+label);return}
  if(window.parent!==window)window.parent.postMessage({type:'WILLAI_QR_EXTERNAL',url:link},location.origin);
  else location.href=link;
 }
 function actionLink(type,value,links){
  if(type==='google')return safeUrl(value||links.google);
  if(type==='whatsapp')return wa(value||links.whatsapp);
  if(type==='instagram')return safeUrl(value||links.instagram);
  if(type==='site')return safeUrl(value||links.site);
  if(type==='phone'){const n=phone(value);return n.length>=10?'tel:+'+n:''}
  if(type==='email'){const e=String(value||'').trim();return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)?'mailto:'+e:''}
  return safeUrl(value);
 }

 const ICONS={
 whatsapp:'<path d="M20.3 11.4a8.4 8.4 0 0 1-12.5 7.2L3 20l1.4-4.8a8.4 8.4 0 1 1 15.9-3.8Z"/><path d="M8.6 8.2c.3-.4.6-.4.9 0l.9 1.3c.3.3.2.6-.1.9l-.3.4c.7 1.3 1.9 2.3 3.1 2.8l.4-.5c.2-.3.6-.4.9-.2l1.5.9c.3.2.4.5.1.9-.6.9-1.4 1.1-2.2.9-2.6-.6-5.3-3-5.9-5.5-.2-.8.1-1.5.7-1.9Z"/>',
 instagram:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.4" cy="6.7" r=".9" fill="currentColor" stroke="none"/>',
 pix:'<path d="m8.5 4 2.4-2.2a1.6 1.6 0 0 1 2.2 0L15.5 4m4.5 4.5 2.2 2.4a1.6 1.6 0 0 1 0 2.2L20 15.5m-4.5 4.5-2.4 2.2a1.6 1.6 0 0 1-2.2 0L8.5 20M4 15.5l-2.2-2.4a1.6 1.6 0 0 1 0-2.2L4 8.5"/><path d="m6 12 3.2 3.2a4 4 0 0 0 5.6 0L18 12l-3.2-3.2a4 4 0 0 0-5.6 0L6 12Z"/>',
 google:'<path d="M20.3 11.9H12v3.6h4.7a5.1 5.1 0 0 1-4.7 3.1A6.7 6.7 0 1 1 17 7.2"/><path d="M20.9 12c.1.9 0 1.7-.2 2.4"/>',
 calendar:'<rect x="3" y="5" width="18" height="16" rx="2.3"/><path d="M7.5 2.5v5m9-5v5M3 10.4h18M8 15l2.3 2.3 5.8-5.5"/>',
 globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c5.5 5 5.5 13 0 18M12 3c-5.5 5-5.5 13 0 18"/>',
 map:'<path d="M19 10c0 5-7 11-7 11s-7-6-7-11a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.3"/>',
 phone:'<path d="m6 3.5 3.4 3.6-1.9 2.3a13 13 0 0 0 6.1 6.1l2.3-1.9 3.6 3.4c.7.8.5 1.9-.4 2.5-2 1.3-4.6.6-8.7-3.5C6.3 12 3.1 7.3 3.8 5c.4-1 1.5-2 2.2-1.5Z"/>',
 email:'<rect x="2.5" y="4.5" width="19" height="15" rx="2"/><path d="m3 6 9 7 9-7"/>',
 menu:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
 shop:'<path d="M4 8h16l-1 13H5L4 8ZM8 9V6a4 4 0 0 1 8 0v3"/>',
 youtube:'<rect x="2" y="5" width="20" height="14" rx="5"/><path d="m10 9 5 3-5 3Z"/>',
 facebook:'<path d="M14 21v-8h3l.5-4H14V7.2c0-1.2.6-1.7 1.8-1.7H18V2c-.9-.1-1.8-.2-2.7-.2-3.3 0-5.2 1.8-5.2 5.2V9H7v4h3v8"/>',
 tiktok:'<path d="M14 3v11.2a4.2 4.2 0 1 1-3.9-4.2M14 3c.6 2.6 2.1 4.2 5.5 4.7"/>',
 chat:'<path d="M20 11a8 8 0 0 1-8 8 9 9 0 0 1-4-.9L3 20l1.7-4.7A8 8 0 1 1 20 11Z"/>',
 link:'<path d="m10 13 4-4M8.5 16H6a4 4 0 0 1 0-8h4M15.5 8H18a4 4 0 0 1 0 8h-4"/>'
 };
 function vector(name){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" aria-hidden="true" focusable="false">'+(ICONS[name]||ICONS.link)+'</svg>'}
 function iconFor(type,label){
  const l=String(label||'').toLowerCase();
  if(type==='google'||/avaliar|avaliação|google/.test(l))return 'google';
  if(type==='whatsapp'||/whats/.test(l))return 'whatsapp';
  if(type==='instagram'||/instagram/.test(l))return 'instagram';
  if(type==='pix'||/pix/.test(l))return 'pix';
  if(type==='phone'||/ligar|telefone/.test(l))return 'phone';
  if(type==='email'||/e-?mail/.test(l))return 'email';
  if(/agend|reserva|horário|horario|marcar/.test(l))return 'calendar';
  if(/cardápio|cardapio|menu/.test(l))return 'menu';
  if(/maps|localiz|endereço|endereco|rota/.test(l))return 'map';
  if(/youtube/.test(l))return 'youtube';
  if(/facebook/.test(l))return 'facebook';
  if(/tiktok/.test(l))return 'tiktok';
  if(/delivery|catálogo|catalogo|loja|compr/.test(l))return 'shop';
  if(/orçamento|orcamento/.test(l))return 'chat';
  if(type==='site'||/site|web|página|pagina/.test(l))return 'globe';
  return 'link';
 }

 function render(c){
  config=c||{};
  const links=config.links||{},media=config.media||{},content=config.content||{};const smart=config.smart?.enabled?config.smart:(()=>{const buttons=[];for(const [type,label,value] of [['google','Avaliar no Google',links.google],['whatsapp','WhatsApp',links.whatsapp],['instagram','Instagram',links.instagram],['site','Nosso site',links.site]])if(value)buttons.push({type,label,value});(config.extraButtons||[]).forEach(b=>{if(b?.title&&b?.url)buttons.push({type:'url',label:b.title,value:b.url})});return {style:'clean',color:'#286a85',secondary:'#9bc7cd',background:'#f7f8fa',buttons}})();
  const theme='clean';
  root.dataset.theme=theme;
  const custom=color(smart.color,'#286a85');
  const background=color(smart.background,'#f7f8fa');
  document.documentElement.style.setProperty('--accent',custom);
  document.documentElement.style.setProperty('--accent-text',smart.colorText==='dark'?'#112136':'#ffffff');
  root.style.setProperty('--bg',background);root.style.removeProperty('background');document.documentElement.style.setProperty('--secondary',color(smart.secondary,'#9bc7cd'));const rgb=[1,3,5].map(i=>parseInt(background.slice(i,i+2),16));const dark=.2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2]<132;root.style.setProperty('--ink',dark?'#f5f8fc':'#192b3d');root.style.setProperty('--muted',dark?'#b5c4d2':'#738092');root.style.setProperty('--card',dark?'rgba(255,255,255,.1)':'rgba(255,255,255,.91)');root.style.setProperty('--line',dark?'rgba(255,255,255,.18)':'#dfe5e9');root.style.setProperty('--chip',dark?'rgba(255,255,255,.14)':'#edf3f6');
  $('smartName').textContent=content.companyName||'Meu negócio';
  $('smartCategory').textContent=smart.category||'';
  $('smartCategory').hidden=!smart.category;
  $('smartDescription').textContent=smart.description||'';
  $('smartDescription').hidden=!smart.description;
  const logo=safeUrl(media.logo),photo='';
  $('smartLogo').hidden=!logo;$('smartInitial').hidden=!!logo;
  if(logo)$('smartLogo').src=logo;else $('smartLogo').removeAttribute('src');
  $('smartInitial').textContent=String(content.companyName||'W').trim().slice(0,1).toUpperCase();
  // A foto é opcional e nunca substitui os dados do estabelecimento.
  $('smartCover').hidden=!photo;$('smartCover').classList.toggle('has-photo',!!photo);
  if(photo)$('smartCover').src=photo;else $('smartCover').removeAttribute('src');
  const wrap=$('smartActions');wrap.replaceChildren();
  const buttons=Array.isArray(smart.buttons)?smart.buttons.slice(0,24):[];
  for(const item of buttons){
   const type=String(item?.type||'url'),label=String(item?.label||'').trim().slice(0,70);
   if(!label)continue;
   const btn=document.createElement('button');btn.type='button';btn.className='action';btn.style.setProperty('--qr-order',String(Math.min(wrap.children.length,12)));const icon=document.createElement('span');icon.className='action-icon';icon.innerHTML=vector(iconFor(type,label));const title=document.createElement('span');title.className='action-label';title.textContent=label;btn.append(icon,title);
   if(type==='pix'){
    const payload=String(smart.pixPayload||'').trim();
    const key=String(smart.pixKey||'').trim();
    if(!payload&&!key)continue;
    btn.addEventListener('click',()=>{if(preview){showToast('Prévia: copiar dados Pix');return}
      pixToCopy=payload||key;$('pixValue').textContent=pixToCopy;
      $('pixTitle').textContent='Pagar com Pix';
      $('pixExplanation').textContent=payload?'Copie o código Pix Copia e Cola e finalize o pagamento no seu banco.':'Copie a chave Pix e faça a transferência no aplicativo do seu banco.';
      $('pixStatus').textContent='';$('pixModal').showModal();
    });
   }else{
    const href=actionLink(type,item.value,links);
    if(!href)continue;
    btn.addEventListener('click',()=>{if(href.startsWith('tel:')||href.startsWith('mailto:')){if(preview)showToast('Prévia: '+label);else location.href=href;}else external(href,label)});
   }
   wrap.append(btn);
  }
  if(!wrap.children.length){const p=document.createElement('p');p.className='description';p.textContent='Em breve, nossos contatos estarão disponíveis aqui.';wrap.append(p)}
  document.title=(content.companyName||'Meu negócio')+' | WillAI';
 }
 $('smartLogin').addEventListener('click',()=>{if(preview){showToast('Acesso do proprietário');return}if(window.parent!==window)window.parent.postMessage({type:'WILLAI_QR_LOGIN'},location.origin)});
 $('pixClose').addEventListener('click',()=>$('pixModal').close());
 $('pixModal').addEventListener('click',e=>{if(e.target===$('pixModal'))$('pixModal').close()});
 $('pixCopy').addEventListener('click',async()=>{
  try{await navigator.clipboard.writeText(pixToCopy);$('pixStatus').textContent='Pix copiado. Abra seu aplicativo bancário.'}
  catch{
   const area=document.createElement('textarea');area.value=pixToCopy;area.style.position='fixed';area.style.opacity='0';document.body.append(area);area.select();
   try{$('pixStatus').textContent=document.execCommand('copy')?'Pix copiado.':'Selecione o código para copiar.'}catch{$('pixStatus').textContent='Selecione o código para copiar.'}
   area.remove();
  }
 });
 window.addEventListener('message',e=>{if(e.source!==window.parent||e.origin!==location.origin||e.data?.type!=='WILLAI_REVIEW_PREVIEW')return;
  if(e.data.config&&typeof e.data.config==='object')render(e.data.config);
  if(window.parent!==window)window.parent.postMessage({type:'WILLAI_QR_RENDERED'},location.origin);
 });
