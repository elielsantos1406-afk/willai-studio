 const safeUrl=x=>{if(typeof x!=='string'||!x.trim())return '';if(/^data:image\/(png|jpeg|webp);base64,[a-zA-Z0-9+/=]+$/.test(x)&&x.length<4000000)return x;try{const u=new URL(x);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}};
 const webUrl=x=>{const v=safeUrl(x);return v.startsWith('data:')?'':v};
 function toast(text){const t=$('toast');t.textContent=text;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,3200)}
 function openLink(value,label){const url=webUrl(value);if(!url){toast('Configure o link de '+label+' no editor WillAI.');return}if(new URLSearchParams(location.search).has('preview')){toast('Prévia: este botão abriria '+label+'.');return}if(window.parent!==window){window.parent.postMessage({type:'WILLAI_QR_EXTERNAL',url},location.origin)}else{location.assign(url)}}
 function phoneUrl(value){if(!value)return '';if(/^https?:\/\//i.test(value))return webUrl(value);const nums=String(value).replace(/\D/g,'');return nums.length>=10&&nums.length<=15?'https://wa.me/'+nums:''}
 function updateStars(){document.querySelectorAll('.star-button').forEach(b=>{const active=Number(b.dataset.star)<=(hovered||selected);b.classList.toggle('is-on',active);b.setAttribute('aria-pressed',String(Number(b.dataset.star)===selected))})}
 const tint={background:'--background',backgroundSecondary:'--background-secondary',accent:'--accent',gold:'--gold',surface:'--surface',surfaceSoft:'--surface-soft',ink:'--ink',button:'--button',buttonText:'--button-text',bodyText:'--body-text',contact:'--contact'};
 function render(next){
  config={...structuredClone(defaults),...(next||{}),content:{...defaults.content,...(next?.content||{})},media:{...defaults.media,...(next?.media||{})},links:{...defaults.links,...(next?.links||{})},visible:{...defaults.visible,...(next?.visible||{})},theme:{...defaults.theme,...(next?.theme||{})}};
  Object.entries(tint).forEach(([k,v])=>{const c=config.theme?.[k];if(/^#[\da-f]{6}$/i.test(c||''))document.documentElement.style.setProperty(v,c)});
  document.documentElement.style.setProperty('--radius',Math.max(14,Math.min(48,Number(config.theme.radius)||28))+'px');
  document.documentElement.style.setProperty('--glow',Math.max(0,Math.min(100,Number(config.theme.glow??80)))/100);
  const fonts={modern:"'Inter','Segoe UI',system-ui,sans-serif",rounded:"'Trebuchet MS',system-ui,sans-serif",editorial:"'Gill Sans','Segoe UI',system-ui,sans-serif"};document.documentElement.style.setProperty('--font-ui',fonts[config.theme.font]||fonts.modern);
  for(const k of ['topLabel','companyName','titleFirst','titleSecond','reviewTag','reviewHeading','ratingLabel','googleButtonText','whatsappLabel','instagramLabel','siteLabel']){const el=$(k);if(el)el.textContent=typeof config.content?.[k]==='string'?config.content[k]:''}
  $('footerText').textContent=config.content?.footerText||'Criado por WILLAI by ELIX SOLUTIONS';
  document.title='Deixe sua avaliação • '+(config.content?.companyName||'WillAI');
  const logo=safeUrl(config.media?.logo);$('businessLogo').hidden=!logo;$('logoPlaceholder').hidden=!!logo;if(logo)$('businessLogo').src=logo;else $('businessLogo').removeAttribute('src');
  const photo=safeUrl(config.media?.photo);$('coverBackdrop').style.backgroundImage=photo?'url('+JSON.stringify(photo)+')':'none';
  for(const k of ['whatsapp','instagram','site'])$(k+'Button').hidden=config.visible?.[k]===false;
  const oldExtras=document.querySelectorAll('[data-v4-extra]');
  oldExtras.forEach(el=>el.remove());
  const container=document.querySelector('.contact-actions');
  (Array.isArray(config.extraButtons)?config.extraButtons:[]).slice(0,12).forEach(btn=>{
    const address=webUrl(btn?.url),name=String(btn?.title||'').trim().slice(0,50);
    if(!address||!name)return;
    const button=document.createElement('button');
    button.type='button';button.className='contact-action';button.dataset.v4Extra='1';
    const label=document.createElement('span');label.className='contact-action-name';label.textContent=name;
    const symbol=document.createElement('span');symbol.className='contact-action-icon';symbol.textContent='✦';
    const arrow=document.createElement('span');arrow.className='contact-action-arrow';arrow.textContent='↗';
    button.append(symbol,label,arrow);
    button.addEventListener('click',()=>openLink(address,name));
    container.append(button);
  });

  updateStars();
 }
 document.querySelectorAll('.star-button').forEach(button=>{
   const n=Number(button.dataset.star);
   button.addEventListener('mouseenter',()=>{hovered=n;updateStars()});
   button.addEventListener('mouseleave',()=>{hovered=0;updateStars()});
   button.addEventListener('focus',()=>{hovered=n;updateStars()});
   button.addEventListener('blur',()=>{hovered=0;updateStars()});
   button.addEventListener('click',()=>{selected=n;hovered=0;updateStars();openLink(config.links?.google,'avaliação do Google')});
 });
 $('googleButton').addEventListener('click',()=>openLink(config.links?.google,'avaliação do Google'));
 document.querySelectorAll('[data-service]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.service;openLink(k==='whatsapp'?phoneUrl(config.links?.whatsapp):config.links?.[k],k==='site'?'Nosso Site':k)}));
 $('loginButton').addEventListener('click',()=>{window.dispatchEvent(new CustomEvent('willai:login',{detail:{code:config.code||''}}));if(window.parent!==window){window.parent.postMessage({type:'WILLAI_QR_LOGIN'},location.origin);return}if(typeof window.WILLAI_LOGIN_HANDLER==='function'){window.WILLAI_LOGIN_HANDLER(config);return}openLink(config.links?.login,'login')});
 window.addEventListener('message',e=>{if(e.source!==window.parent||e.origin!==location.origin||e.data?.type!=='WILLAI_REVIEW_PREVIEW')return;if(e.data.config&&typeof e.data.config==='object')(render(e.data.config),document.documentElement.classList.remove('qr-embedded'))});
 window.WILLAI_REVIEW=Object.freeze({render,getConfig:()=>structuredClone(config)});
 render(config);if(window.parent!==window)window.parent.postMessage({type:'WILLAI_QR_READY'},location.origin);
})();
</script>
</body>
</html>
