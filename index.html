<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07316e"><title>WillAI | Tecnologia & Soluções Digitais</title><meta name="description" content="WillAI: sites, sistemas inteligentes, automações e soluções digitais para negócios."><link rel="icon" href="/assets/willai-logo-original.png?v=5" type="image/png"><link rel="preload" as="style" href="/assets/page.css"><link rel="stylesheet" href="/assets/page.css"><style>
body{margin:0;background:#f4f8fd;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#153961}
.loading{min-height:86vh;display:grid;align-content:center;justify-items:center;padding:38px 18px;text-align:center;max-width:640px;margin:auto}
.loading-symbol{width:74px;height:74px;display:grid;place-items:center;margin:0 0 24px;background:#e8f3ff;border:1px solid #d5e9fb;border-radius:23px;box-shadow:0 18px 42px #00578c18}
.loading-symbol img{width:49px;height:49px;object-fit:contain}
.loading strong{display:block;font-weight:850;letter-spacing:-.045em;font-size:clamp(27px,4vw,37px);line-height:1.12;margin-bottom:11px}
.loading small{font-size:14px;color:#687f9b;line-height:1.55}
.loading-track{height:4px;width:175px;overflow:hidden;border-radius:20px;background:#dceaf7;margin-top:26px}
.loading-track::after{content:"";display:block;width:43%;height:100%;border-radius:20px;background:linear-gradient(90deg,#073e80,#1cc3e5);animation:willai-progress 1.1s ease-in-out infinite alternate}
@keyframes willai-progress{from{transform:translateX(-110%)}to{transform:translateX(330%)}}
@media(prefers-reduced-motion:reduce){.loading-track::after{animation:none;width:100%}}
#app{min-height:50vh}


/* Primeira tela de verdade, presente no HTML antes de qualquer consulta. Nenhum loader. */
html,body{margin:0;min-height:100%;background:#071b34}
#app{min-height:100svh}
.wh-immediate-hero{box-sizing:border-box;min-height:100svh;color:#fff;background:radial-gradient(ellipse at 80% 16%,#19588466,transparent 54%),linear-gradient(140deg,#071a31,#0a2a49 70%,#061a30);padding:0 max(22px,calc((100vw - 1144px)/2));font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.wh-immediate-head{display:flex;align-items:center;gap:10px;min-height:75px}
.wh-immediate-head img{width:37px;height:37px;object-fit:contain}
.wh-immediate-brand{font-size:17px;font-weight:850;letter-spacing:.045em}
.wh-immediate-inner{min-height:calc(100svh - 75px);display:flex;justify-content:center;flex-direction:column;padding:38px 0 76px;max-width:860px;box-sizing:border-box}
.wh-immediate-tag{color:#a0deed;font-weight:800;font-size:11px;letter-spacing:.13em}
.wh-immediate-inner h1{font-weight:820;font-size:clamp(43px,5.8vw,76px);line-height:1.1;letter-spacing:-.055em;margin:23px 0 12px;text-wrap:balance;overflow-wrap:break-word}
.wh-immediate-inner h1 em{font-style:normal;color:#76dff4;display:block}
.wh-immediate-inner p{font-size:clamp(15px,1.8vw,19px);line-height:1.5;color:#c5d9e8;margin:0 0 28px}
.wh-immediate-ctas{display:flex;gap:12px;flex-wrap:wrap}
.wh-immediate-ctas a{box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;min-height:51px;border-radius:14px;padding:13px 20px;font-weight:800;font-size:14px;text-decoration:none;color:#fff;border:1px solid #ffffff66}
.wh-immediate-ctas a:first-child{background:#73dcec;color:#073047;border-color:#73dcec}
.wh-immediate-bottom{display:flex;align-items:center;gap:13px;color:#9bc4d5;font-size:11px;letter-spacing:.1em;margin-top:50px;text-transform:uppercase}
.wh-immediate-bottom span{display:inline-block;color:#9be8f4}
@media(max-width:760px){
.wh-immediate-hero{padding:0 22px}
.wh-immediate-head{min-height:69px}
.wh-immediate-inner{min-height:calc(100svh - 69px);padding:24px 0 56px}
.wh-immediate-inner h1{font-size:clamp(34px,8.5vw,50px);line-height:1.12;margin:18px 0 14px}
.wh-immediate-inner p{font-size:15px;margin-bottom:23px}
.wh-immediate-ctas{flex-direction:column;gap:10px}
.wh-immediate-ctas a{min-height:52px;width:100%}
.wh-immediate-bottom{margin-top:33px}
}
@media(prefers-reduced-motion:reduce){.wh-immediate-hero *{scroll-behavior:auto}}
</style></head>
<body><main id="app"><div class="wh-immediate-hero" aria-label="Página inicial WillAI">
 <div class="wh-immediate-head"><img src="/assets/willai-logo-original.png" width="37" height="37" alt=""><span class="wh-immediate-brand">WILLAI</span></div>
 <div class="wh-immediate-inner"><span class="wh-immediate-tag">WILLAI · TECNOLOGIA &amp; SOLUÇÕES DIGITAIS</span>
 <h1>Seu negócio merece mais do que um site.<em>Merece evoluir.</em></h1>
 <p>Sites, sistemas e automações sob medida.</p>
 <div class="wh-immediate-ctas"><a href="/contato">Solicitar orçamento ↗</a><a href="/portfolio">Ver projetos</a></div>
 <div class="wh-immediate-bottom">EXPLORE NOSSAS SOLUÇÕES <span aria-hidden="true">↓</span></div>
 </div></div></main><aside id="dock" class="banner-dock" aria-label="Carrossel institucional"></aside><div id="toast" class="toast" role="status" aria-live="polite"></div><div id="infoDialog" class="dialogwrap"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle"></h2><p id="modalText"></p><button type="button" class="done">Fechar</button></div></div>
<script>
/* A primeira pintura reflete a rota pedida, antes do carregamento dinâmico. */
(()=>{
 const segment=location.pathname.split('/').filter(Boolean)[0]||'';
 const pages={
  contato:['Conte sua ideia. Nós criamos a solução.','Escolha a solução e solicite seu orçamento.'],
  suporte:['Como podemos ajudar?','Fale com nossa equipe de suporte.'],
  servicos:['Tecnologia para o seu negócio.','Sites, sistemas e automações sob medida.'],
  portfolio:['Projetos que mostram o que fazemos.','Explore nossos modelos e soluções digitais.'],
  sobre:['Quem está por trás da WillAI.','Tecnologia desenvolvida por pessoas.'],
  projeto:['Mais negócios no digital.','Inclusão digital para pequenos empreendedores.']
 };
 if(!pages[segment])return;
 const shell=document.querySelector('.wh-immediate-hero');
 if(!shell)return;
 shell.querySelector('h1').textContent=pages[segment][0];
 shell.querySelector('.wh-immediate-inner p').textContent=pages[segment][1];
 shell.querySelector('.wh-immediate-ctas').hidden=true;
 shell.querySelector('.wh-immediate-bottom').hidden=true;
})();
</script>
<style>.wh-immediate-ctas[hidden],.wh-immediate-bottom[hidden]{display:none!important}</style>
<script src="/config.js"></script><script src="/assets/router.js"></script></body></html>
