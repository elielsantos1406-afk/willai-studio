<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#16120e">
  <meta name="description" content="WillAI Burger — cardápio digital e pedidos pelo WhatsApp.">
  <title>WillAI Burger — Cardápio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/willaiburger/styles.css?v=8">
  <script src="/config.js"></script>
  <script src="/willaiburger/app.js?v=7" defer></script>
</head>
<body>
  <main>
    <section class="hero" id="inicio" aria-label="WillAI Burger">
      <img id="hero-photo" class="hero-photo" src="/willaiburger/assets/cover-premium.webp" alt="Hambúrguer artesanal em destaque">
      <div class="hero-shade"></div>
      <a id="hero-trigger" class="hero-trigger" href="#cardapio" aria-label="Toque para abrir o cardápio">
        <div class="hero-copy">
          <img id="hero-logo" src="/willaiburger/assets/logo-dark.webp" alt="Logo do restaurante">
          <span id="hero-eyebrow" class="hero-eyebrow">BEM-VINDO</span>
          <h1 id="hero-headline">Seu próximo favorito está aqui.</h1>
        </div>
        <img id="hero-product" class="hero-product" alt="Produto em destaque" hidden>
        <span id="hero-caption" class="hero-caption hero-hint">Toque na tela para começar</span>
      </a>
    </section>
    <section class="menu-section" id="cardapio">
      <div class="content">
        <div class="section-heading reveal"><span>WILLAI BURGER</span><h1>O que vai ser hoje?</h1></div>
        <div class="category-strip reveal" id="categories" aria-label="Categorias de produtos"></div>
        <div class="highlight-title reveal" id="featured-title"><div><small>ESCOLHAS DA CASA</small><h2>Mais pedidos</h2></div><span>Os favoritos</span></div>
        <div id="featured" class="featured reveal"></div>
        <div class="product-header reveal"><div><small>ESCOLHA O SEU</small><h2 id="category-heading">Cardápio completo</h2></div></div>
        <label class="menu-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><input id="search" class="search-field" type="search" placeholder="Buscar um produto" aria-label="Buscar produtos"></label>
        <div id="products" class="products"></div>
      </div>
    </section>
  </main>
  <footer><img src="/willaiburger/assets/logo.webp" alt="WillAI Burger"><small>Desenvolvido por WillAI</small></footer>
  <button class="floating-cart" id="floating-cart" type="button"><span>Sacola</span><strong id="floating-total">R$ 0,00</strong></button>
  <div class="scrim" id="scrim" hidden></div>
  <dialog class="product-dialog" id="product-dialog" aria-labelledby="dialog-name"><button class="dialog-close" id="close-product" aria-label="Fechar">×</button><div id="product-detail"></div></dialog>
  <aside id="cart-drawer" class="drawer" role="dialog" aria-modal="true" aria-label="Minha sacola" aria-hidden="true">
    <div class="drawer-head"><h2>Minha sacola</h2><button id="close-cart" aria-label="Fechar sacola">×</button></div>
    <div id="cart-items" class="cart-items"></div>
    <div class="checkout-form">
      <label>Seu nome<input id="customer-name" placeholder="Nome para o pedido" autocomplete="name"></label>
      <label>Como deseja receber?<select id="fulfillment"><option value="Retirada">Retirar no local</option><option value="Entrega">Receber por entrega</option></select></label>
      <label>Endereço / observação<textarea id="delivery-address" rows="2" placeholder="Endereço, referência ou observações"></textarea></label>
      <label>Pagamento<select id="payment"><option>Pix</option><option>Dinheiro</option><option>Cartão</option></select></label>
      <div class="total-row"><span>Total dos produtos</span><strong id="cart-total">R$ 0,00</strong></div>
      <button id="checkout-button" class="checkout-button" type="button">Continuar no WhatsApp</button>
      <small>O envio do pedido é confirmado no WhatsApp.</small>
    </div>
  </aside>
</body>
</html>
