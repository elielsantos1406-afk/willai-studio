function randomId(){const b=new Uint8Array(16);if(globalThis.crypto?.getRandomValues)crypto.getRandomValues(b);else for(let i=0;i<b.length;i++)b[i]=Math.floor(Math.random()*256);return Array.from(b,x=>x.toString(16).padStart(2,'0')).join('')}

function normalizeCuritibaPatrocinio(config){
 const current=config?.cities?.curitiba;
 if(!current)return config;
 const isLegacy=String(current.sponsor||'').trim()==='Anderson Marques'
  ||String(current.sponsorUrl||'').includes('/andersonmarquescwb/')
  ||String(current.sponsorImage||'').includes('banner-anderson.png')
  ||String(current.partnershipImage||'').includes('banner-parceria.png');
 if(isLegacy){
  const currentData=seed.cities.curitiba;
  for(const key of ['sponsor','sponsorRole','sponsorAbout','sponsorQuote','sponsorUrl','sponsorLogo','sponsorImage','partnershipImage','howTitle','howText','howSteps','extraSections']){
   current[key]=structuredClone(currentData[key]);
  }
 }
 return config;
}

document.addEventListener('submit',async e=>{
 const isQuote=e.target.id==='willai-quote-form',isSupport=e.target.id==='willai-support-form';
 if(!isQuote&&!isSupport)return;
 e.preventDefault();
 const form=e.target,status=form.querySelector(isQuote?'#quoteStatus':'#supportStatus'),btn=form.querySelector('[type="submit"]');
 const d=Object.fromEntries(new FormData(form));
 if(d.website){status.textContent='Não foi possível validar a solicitação. Tente novamente.';return}
 if(!d.privacy||String(d.description||'').trim().length<15){status.textContent='Preencha a descrição e autorize o contato.';return}
 const values={
  name:String(d.name||'').trim(),whatsapp:String(d.whatsapp||'').trim(),
  email:String(d.email||'').trim(),service:String(d.service||'').trim(),
  description:String(d.description||'').trim()
 };
 if(isSupport)values.issue_type=String(d.issue_type||'').trim();
 const phone=values.whatsapp.replace(/\D/g,'').replace(/^55(?=\d{10,11}$)/,'');
 if(!/^[1-9]{2}\d{8,9}$/.test(phone)||/^(\d)\1+$/.test(phone)){status.textContent='Informe um WhatsApp válido com DDD.';return}
 if(values.name.length<2||values.service.length<2||values.description.length<15||(isSupport&&!['technical','access','qr','configuration','billing','other'].includes(values.issue_type))){status.textContent='Confira os campos obrigatórios.';return}
 btn.disabled=true;status.textContent=isSupport?'Registrando seu pedido de suporte…':'Enviando seu pedido de orçamento…';
 try{
  const table=isSupport?'willai_support_requests':'willai_quote_requests';
  await request('/rest/v1/'+table,{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(values)},null);
  form.innerHTML='<div class="quote-confirmation"><div class="quote-check">✓</div><h2>'+(isSupport?'Pedido de suporte registrado!':'Solicitação de orçamento recebida!')+'</h2><p>'+(isSupport?'Recebemos seu relato. A equipe analisará o atendimento e poderá retornar pelo WhatsApp informado.':'Nossa equipe analisará seu projeto e poderá entrar em contato pelo WhatsApp informado.')+'</p><a href="/" class="btn btn-main">Voltar ao início</a></div>';
 }catch(err){
  status.textContent='Não foi possível enviar agora. Confira os campos e tente novamente.';
  console.error(isSupport?'Suporte:':'Orçamento:',err);
 }finally{btn.disabled=false}
});
/* SEO para rotas públicas — metadados atualizados após navegação SPA. */
function updateSeoMeta(){
 if(adminMode){
  setSeoTag('robots','noindex,nofollow');
  document.querySelector('link[rel="canonical"]')?.remove();
  document.getElementById('willai-schema')?.remove();
  return;
 }
 const r=route(),parts=r.split('/').filter(Boolean);
 const fixed={
  '': ['Criação de Sites e Sistemas para Empresas | WillAI','Criação de sites profissionais, landing pages, sistemas e soluções digitais para negócios. Conheça os projetos e solicite um orçamento.'],
  servicos:['Criação de Sites, Landing Pages e Sistemas | WillAI','Sites institucionais, landing pages, portais, sistemas de gestão, automações e soluções digitais desenvolvidos pela WillAI.'],
  portfolio:['Portfólio de Sites e Sistemas | WillAI','Conheça demonstrações e projetos digitais desenvolvidos pela WillAI para empresas e empreendedores.'],
  sobre:['Sobre a WillAI | Tecnologia & Soluções Digitais','Conheça a WillAI — By ELIX SOLUTIONS e nossa atuação em desenvolvimento de sites, sistemas, automações e inclusão digital.'],
  projeto:['Projeto de Inclusão Digital para Negócios | WillAI','O Projeto de Inclusão Digital da WillAI apoia pequenos empreendedores a ampliar sua presença e oportunidades na internet.'],
  contato:['Solicitar Orçamento de Site ou Sistema | WillAI','Solicite um orçamento para criação de site, landing page, sistema ou solução digital personalizada com a WillAI.'],
  suporte:['Suporte Técnico para Clientes | WillAI','Abra uma solicitação de suporte para sites, sistemas, QR Codes e serviços já contratados da WillAI.'],
  plaquinhas:['Plaquinhas QR Code e NFC | WillAI','Conheça as soluções de plaquinhas digitais com QR Code e NFC da WillAI.']
 };
 let page=fixed[r],indexable=Boolean(page);
 let canonicalPath=r;
 if(parts.length===1&&state.cities?.[r]){
  const c=state.cities[r];
  page=['Projeto de Inclusão Digital em '+c.name+' | WillAI',
   c.subtitle||'Conheça as iniciativas de inclusão digital da WillAI em '+c.name+'.'];
  indexable=true;
 }else if(parts.length===2&&state.companies?.[parts[1]]?.city===parts[0]&&state.cities?.[parts[0]]){
  const c=state.companies[parts[1]];
  page=[(c.name||'Empresa participante')+' | Projeto de Inclusão Digital — WillAI',
   'Conheça '+(c.name||'o negócio')+', seus serviços e formas de contato no Projeto de Inclusão Digital da WillAI.'];
  indexable=true;
 }else if(parts.length===2&&parts[0]==='pagina'&&state.pages?.[parts[1]]){
  const c=state.pages[parts[1]];
  page=[(c.title||'Página digital')+' | WillAI',c.subtitle||'Conheça esta solução digital da WillAI.'];
  indexable=true;
 }else if(parts.length===1&&r==='login'){
  page=['Acesso de Clientes | WillAI','Área de acesso a serviços da WillAI.'];
 }else if(parts[0]==='p'||parts[0]==='qr'){
  page=['Plaquinha digital | WillAI','Página de acesso à plaquinha digital.'];
 }
 if(!page){page=['Página não encontrada | WillAI','O endereço solicitado não foi encontrado.'];indexable=false}
 const title=String(page[0]).slice(0,115);
 const description=String(page[1]).replace(/\s+/g,' ').trim().slice(0,165);
 document.title=title;
 setSeoTag('description',description);
 setSeoTag('robots',indexable?'index,follow':'noindex,follow');
 setSeoTag('og:title',title,true);
 setSeoTag('og:description',description,true);
 setSeoTag('og:type','website',true);
 setSeoTag('twitter:card','summary');
 const canonical=document.querySelector('link[rel="canonical"]')||document.createElement('link');
 if(indexable){
  const path=canonicalPath?'/'+canonicalPath.replace(/^\/+|\/+$/g,''):'/';
  const safePath=path.split('/').map(x=>encodeURIComponent(decodeURIComponent(x))).join('/');
  const full='https://willai.com.br'+safePath;
  canonical.rel='canonical';canonical.href=full;
  if(!canonical.parentNode)document.head.append(canonical);
  setSeoTag('og:url',full,true);
 }else{
  canonical.remove();
  document.querySelector('meta[property="og:url"]')?.remove();
 }
 const existing=document.getElementById('willai-schema');
 if(existing)existing.remove();
 if(indexable&&(r===''||r==='projeto')){
  const org={'@type':'Organization','@id':'https://willai.com.br/#organization',
   name:'WillAI — By ELIX SOLUTIONS',url:'https://willai.com.br/',
   logo:'https://willai.com.br/assets/willai-logo-original.png'};
  const graph=[org,{'@type':'WebSite','@id':'https://willai.com.br/#website',
   url:'https://willai.com.br/',name:'WillAI — Tecnologia & Soluções Digitais',inLanguage:'pt-BR',publisher:{'@id':org['@id']}}];
  const script=document.createElement('script');script.type='application/ld+json';script.id='willai-schema';
  script.textContent=JSON.stringify({'@context':'https://schema.org','@graph':graph});
  document.head.append(script);
 }
}
function setSeoTag(name,value,property=false){
 const attr=property?'property':'name';
 let meta=document.head.querySelector('meta['+attr+'="'+name+'"]');
 if(!meta){meta=document.createElement('meta');meta.setAttribute(attr,name);document.head.append(meta)}
 meta.content=value;
}
function renderContent(){const r=route(),bits=r.split('/');let html;if(!r)html=home();else if(r==='projeto')html=project();else if(r==='portfolio')html=portfolioPage();else if(r==='sobre')html=aboutPage();else if(r==='contato')html=contactPage();else if(r==='suporte')html=supportPage();else if(r==='servicos')html=`<section class="section"><div class="container"><span class="eyebrow">SERVIÇOS</span><h1>Soluções para sua empresa.</h1><div class="grid three">${serviceCards()}</div></div></section>`;else if(r==='login')html=login();else if(r==='plaquinhas')html=plates();else if(r==='studio')html=login();else if(bits[0]==='pagina')html=customPage(bits[1]);else if(bits[0]==='p')html=singlePlate(bits[1]);else if(bits.length===2&&state.companies[bits[1]])html=company(bits[0],bits[1]);else if(state.cities[r])html=city(r);else html=notFound();document.getElementById('app').innerHTML=html;document.documentElement.style.setProperty('--blue',state.theme.primary);document.documentElement.style.setProperty('--accent',state.theme.accent);updateSeoMeta()}
function routePath(){const r=route();if(!r)return'home';if(r==='projeto')return'project';if(state.cities[r])return'cities.'+r;if(r.startsWith('pagina/')&&state.pages[r.slice(7)])return'pages.'+r.slice(7);if(r.split('/').length===2&&state.companies[r.split('/')[1]])return'companies.'+r.split('/')[1];return'home'}
function get(path){return path.split('.').reduce((a,k)=>a?.[k],state)}
function set(path,value){const parts=path.split('.');const last=parts.pop();const obj=parts.reduce((a,k)=>a?.[k],state);if(!obj)return;obj[last]=value;save();renderContent();document.getElementById('site-header').innerHTML=header();document.getElementById('site-footer').innerHTML=footer()}
function input(path,label,type='text',opts={}){const raw=get(path);const value=String(raw??'').trim()?raw:(opts.defaultValue??raw??'');let inp=type==='textarea'?`<textarea data-field="${esc(path)}" placeholder="${esc(opts.placeholder||'')}" rows="3">${esc(value)}</textarea>`:type==='image'?`<div class="image-editor">${value?`<img src="${esc(value)}" alt="Prévia de ${esc(label)}" class="image-preview">`:'<div class="image-empty">Nenhuma imagem selecionada — o padrão atual permanece ativo</div>'}<input type="file" accept="image/png,image/jpeg,image/webp" data-upload="${esc(path)}"><p class="small-helper">Enviar PNG, JPG ou WebP até 10 MB. A imagem será enviada quando você clicar em <strong>Salvar e publicar</strong>. Se houver falha, seu rascunho será mantido neste navegador.</p>${value?`<div class="minor-actions"><button type="button" data-action="clear-image" data-path="${esc(path)}">Remover imagem</button></div>`:''}</div>`:`<input data-field="${esc(path)}" type="${esc(type)}" value="${esc(value)}" placeholder="${esc(opts.placeholder||'')}">`;return `<div class="field"><label>${esc(label)}</label>${inp}</div>`}

function isPortalNavigation(href){
 try{
  const u=new URL(href,location.href);
  if(u.origin!==location.origin||u.search||u.hash)return false;
  const bits=u.pathname.split('/').filter(Boolean),first=bits[0]||'';
  if(bits.length===0)return true;
  if(bits.length===1)return portalPublicRoutes.has(first)||Boolean(state.cities[first]);
  return bits.length===2&&first==='pagina'&&Boolean(state.pages[bits[1]]);
 }catch{return false}
}

y=state.cities[btn.dataset.city];if(!city)return;city.howSteps||=[];city.howSteps.push({title:'',body:''});save();refreshEditor()}else if(action==='delete-city-step'){const city=state.cities[btn.dataset.city];if(city?.howSteps){city.howSteps.splice(Number(btn.dataset.index),1);save();render();refreshEditor()}}else if(action==='add-city-section'){const city=state.cities[btn.dataset.city];if(!city)return;city.extraSections||=[];city.extraSections.push({title:'',body:''});save();refreshEditor()}else if(action==='delete-city-section'){const city=state.cities[btn.dataset.city];if(city?.extraSections){city.extraSections.splice(Number(btn.dataset.index),1);save();render();refreshEditor()}}else if(action==='add-city')addCity();else if(action==='add-company')addCompany();else if(action==='add-page')addPage();else if(action==='delete-page'){if(confirm('Excluir esta página personalizada?')){delete state.pages[btn.dataset.slug];save();render()}}else if(action==='open-page'){ui.editor=false;location.hash='#/pagina/'+btn.dataset.slug}else if(action==='publish-portal')publishPortal();else if(action==='export'){fileDownload(JSON.stringify(state,null,2),'willai-portal-backup.json','application/json');toast('Backup gerado.') }else if(action==='import'){document.getElementById('backup-input')?.click()}else if(action==='clear-image'){set(btn.dataset.path,'');refreshEditor();render()}});

async function request(path,opts={},credentials=auth){
 const token=credentials?.access_token||null;
 const makeHeaders=authorization=>({apikey:cfg.publishableKey,Accept:'application/json','Content-Type':'application/json',
 ...(authorization?{Authorization:'Bearer '+authorization}:{}),...opts.headers});
 let res=await fetch(cfg.url+path,{...opts,headers:makeHeaders(token)});
 // Caso o token tenha expirado, renovar uma vez; nunca renovar em uma chamada de login/refresh.
 if(res.status===401&&credentials===auth&&auth?.refresh_token&&!path.startsWith('/auth/v1/token')){
   try{const renewed=await fetch(cfg.url+'/auth/v1/token?grant_type=refresh_token',{
    method:'POST',headers:{apikey:cfg.publishableKey,'Content-Type':'application/json'},
    body:JSON.stringify({refresh_token:auth.refresh_token})
   });
   if(renewed.ok){auth=await renewed.json();sessionStorage.setItem(tokenKey,JSON.stringify(auth));
    res=await fetch(cfg.url+path,{...opts,headers:makeHeaders(auth.access_token)})}
   }catch(e){console.warn('Renovação de sessão falhou',e)}
 }
 if(!res.ok){let error;try{error=await res.json()}catch{}
   throw Error(error?.message||error?.error_description||error?.error||('HTTP '+res.status+' ao comunicar com o Supabase'))}
 if(res.status===204)return null;
 const body=await res.text();return body?JSON.parse(body):null;
}

async function loadPublic(){

  request('/rest/v1/willai_pages?published=eq.true&select=slug,name,config&limit=1000')
 ]);
 if(portal.status==='fulfilled'){
  const config=portal.value?.[0]?.config;
  if(config&&typeof config==='object'){state={...state,...config,portfolio:config.portfolio||state.portfolio};cachePublicConfig(config)}
 }else console.warn('Portal: não foi possível atualizar dados',portal.reason);
 state.companyCities||={};
 if(pages.status==='fulfilled'&&Array.isArray(pages.value)){
  const companies={};
  for(const p of pages.value){const d=p.config||{},city=state.companyCities[p.slug]||d.city||'curitiba';

  }

}
async function uploadData(url){
 const m=/^data:image\/(png|jpeg|webp);base64,(.*)$/s.exec(url);
 if(!m)return url;
 if(!auth?.user?.id)throw Error('Sua sessão expirou. Saia e entre novamente antes de publicar imagens.');
 if(!cfg.bucket)throw Error('O armazenamento das imagens ainda não foi configurado.');
 const bin=atob(m[2]),arr=new Uint8Array(bin.length);
 for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
 if(arr.length>10*1024*1024)throw Error('Imagem acima de 10 MB. Comprima o arquivo.');
 const path=auth.user.id+'/portal/'+crypto.randomUUID()+'.'+(m[1]==='jpeg'?'jpg':m[1]);
 const res=await fetch(cfg.url+'/storage/v1/object/'+cfg.bucket+'/'+path,{
  method:'POST',headers:{apikey:cfg.publishableKey,Authorization:'Bearer '+auth.access_token,
  'Content-Type':'image/'+m[1],'x-upsert':'false'},body:arr});
 if(!res.ok){let err={};try{err=await res.json()}catch{}
  throw Error('O Supabase não aceitou a imagem: '+(err.message||err.error||'HTTP '+res.status)+'. Confira Storage > willai-public e a política de uploads.')}
 return cfg.url+'/storage/v1/object/public/'+cfg.bucket+'/'+path;
}
async function replaceMedia(v){if(typeof v==='string')return uploadData(v);if(Array.isArray(v))return Promise.all(v.map(replaceMedia));if(v&&typeof v==='object'){const e=await Promise.all(Object.entries(v).map(async ([k,x])=>[k,await replaceMedia(x)]));return Object.fromEntries(e)}return v}
async function ensureEditorSession(){
 if(!auth?.refresh_token)throw Error('Sessão não encontrada. Entre novamente no painel.');
 // Sempre renova a sessão antes de uma publicação importante.
 // O token anterior pode ter expirado mesmo sem campo expires_at.
 const renewed=await request('/auth/v1/token?grant_type=refresh_token',{
  method:'POST',body:JSON.stringify({refresh_token:auth.refresh_token})
 },null);
 if(!renewed?.access_token||!renewed?.user?.id)throw Error('Não foi possível renovar seu login. Entre novamente.');
 auth=renewed;sessionStorage.setItem(tokenKey,JSON.stringify(auth));
}
async function publishPortal(){
 if(!adminMode||!isAdmin){toast('Acesso negado');return}
 const b=document.querySelector('[data-action="publish-portal"]'),indicator=document.getElementById('editorSaveStatus');
 if(b?.disabled)return;
 if(b){b.disabled=true;b.textContent='Salvando…'}
 if(indicator)indicator.textContent='Gravando alterações no Supabase…';
 try{
   await ensureEditorSession();
   const data=await replaceMedia(normalizeCuritibaPatrocinio(structuredClone(state)));
   const rows=await request('/rest/v1/willai_portal_content?slug=eq.main',{
      method:'PATCH',headers:{Prefer:'return=representation'},
      body:JSON.stringify({config:data,updated_at:new Date().toISOString()})
   });
   if(!Array.isArray(rows)||!rows.length)throw Error('O banco não confirmou a gravação. Confira suas permissões.');
   // Confirmar o conteúdo gravado, e não apenas o retorno HTTP do PATCH.
   const check=await request('/rest/v1/willai_portal_content?slug=eq.main&published=eq.true&select=config&limit=1',{cache:'no-store'});
   const saved=check?.[0]?.config;
   if(!saved)throw Error('A publicação não pôde ser verificada: conteúdo público indisponível.');
   for(const [cityId,cityData] of Object.entries(data.cities||{})){
     const publishedCity=saved.cities?.[cityId];
     if(!publishedCity)throw Error('A cidade '+cityId+' não apareceu no conteúdo publicado.');
     for(const key of ['sponsor','sponsorRole','sponsorAbout','sponsorQuote','sponsorUrl','sponsorLogo','sponsorImage','howTitle','howText']){
       if((publishedCity[key]??'')!==(cityData[key]??'')){
         throw Error('A informação '+key+' de '+cityId+' não corresponde ao texto publicado. Suas alterações permanecem no rascunho.');
       }
     }
   }
   state=saved;cachePublicConfig(saved);clearAdminDraft();
   try{localStorage.setItem('willai_portal_updated_at',String(Date.now()))}catch(e){}
   ui.editor=true;render();
   const success=document.getElementById('editorSaveStatus');
   if(success)success.textContent='✓ Alterações publicadas! Abra o site público para conferir.';
   toast('✓ Projeto salvo e publicado no Supabase!');
 }catch(err){
   const message=err?.message||String(err);
   if(indicator)indicator.textContent='✕ Publicação não realizada: '+message+' | Seu rascunho foi preservado neste dispositivo.';
   toast('Não foi possível publicar: '+message);
   console.error('WillAI publicação',err);
 }finally{
   const btn=document.querySelector('[data-action="publish-portal"]');
   if(btn){btn.disabled=false;btn.textContent='Salvar e publicar ✓'}
 }
}

document.addEventListener('submit',async e=>{if(e.target.id!=='portal-login-form')return;e.preventDefault();const status=document.getElementById('portalLoginStatus');status.textContent='Validando...';try{const email=document.getElementById('portalEmail').value,password=document.getElementById('portalPassword').value;const result=await request('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})},null);auth=result;if(!(await checkAdmin())&&!(await checkAccessRole()))throw Error('Seu usuário não está autorizado para acessar o painel');sessionStorage.setItem(tokenKey,JSON.stringify(result));location.href='/studio/gestao/'}catch(e){status.textContent=e.message}});
(async()=>{
 if(!adminMode){
  restorePublicCache();
  render();
  loadPublic().then(()=>render()).catch(e=>console.warn('Falha na atualização pública',e));
  // Se o editor publicar em outra aba, atualiza automaticamente esta visualização.
  window.addEventListener('storage',e=>{
    if(e.key==='willai_portal_updated_at'){
      loadPublic().then(()=>render()).catch(err=>console.warn('Falha ao atualizar conteúdo publicado',err));
    }
  });
  return;
 }
 await loadPublic();
 try{auth=JSON.parse(sessionStorage.getItem(tokenKey)||'null')}catch{}
 isAdmin=await checkAdmin();
 if(!isAdmin){
  state=structuredClone(seed);
  document.getElementById('site-header').innerHTML='';
  document.getElementById('site-footer').innerHTML='';
  document.getElementById('app').innerHTML=login();
  return;
 }
 const recoveredDraft=restoreAdminDraft();
 const initialTab=new URLSearchParams(location.search).get('edit');if(['page','cities','portfolio','services','brand','pages'].includes(initialTab)){ui.tab=initialTab;ui.editor=true;}else ui.editor=false;render();
 if(recoveredDraft){toast('Rascunho anterior recuperado. Clique em Salvar e publicar para finalizar.')}
})();
})();
