 <div class="quote-grid"><div class="field"><label for="quoteName">Seu nome *</label><input id="quoteName" name="name" autocomplete="name" maxlength="120" minlength="2" required placeholder="Como podemos chamar você?"></div>
 <div class="field"><label for="quoteWhats">WhatsApp com DDD *</label><input id="quoteWhats" name="whatsapp" autocomplete="tel" inputmode="tel" maxlength="20" minlength="10" required placeholder="(41) 99999-9999"></div></div>
 <div class="field"><label for="quoteEmail">E-mail (opcional)</label><input id="quoteEmail" name="email" type="email" maxlength="200" autocomplete="email" placeholder="seu@email.com"></div>

 <div class="field"><label for="quoteDesc">Conte a sua ideia *</label><textarea id="quoteDesc" name="description" rows="5" required minlength="15" maxlength="4000" placeholder="Explique o que gostaria de criar ou qual problema quer resolver."></textarea></div>
 <div class="field quote-trap" aria-hidden="true"><label for="quoteWebsite">Site</label><input id="quoteWebsite" name="website" tabindex="-1" autocomplete="off"></div>

 <p id="quoteStatus" class="quote-status" role="status" aria-live="polite"></p>
 </form></div></div></section>`
}
document.addEventListener('submit',async e=>{
 if(e.target.id!=='willai-quote-form')return;
 e.preventDefault();
 const form=e.target,status=form.querySelector('#quoteStatus'),btn=form.querySelector('[type="submit"]');
 const d=Object.fromEntries(new FormData(form));
 if(d.website){status.textContent='Não foi possível validar a solicitação. Tente novamente.';return}
 if(!d.privacy||String(d.description||'').trim().length<15){status.textContent='Preencha a descrição e autorize o contato.';return}
 const values={name:String(d.name||'').trim(),whatsapp:String(d.whatsapp||'').trim(),email:String(d.email||'').trim(),service:String(d.service||'').trim(),description:String(d.description||'').trim()};
 btn.disabled=true;status.textContent='Enviando sua solicitação com segurança…';
 try{
  await request('/rest/v1/willai_quote_requests',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(values)},null);
  form.innerHTML='<div class="quote-confirmation"><div class="quote-check">✓</div><h2>Solicitação recebida!</h2><p>Obrigado pelo contato. Nossa equipe analisará sua ideia e entrará em contato pelo WhatsApp informado.</p><a href="/" class="btn btn-main">Voltar ao início</a></div>';
 }catch(err){status.textContent='Não foi possível enviar agora. Tente novamente mais tarde.';console.error('Orçamento:',err)}
 finally{btn.disabled=false}
});
function renderContent(){const r=route(),bits=r.split('/');let html;if(!r)html=home();else if(r==='projeto')html=project();else if(r==='portfolio')html=portfolioPage();else if(r==='sobre')html=aboutPage();else if(r==='contato')html=contactPage();else if(r==='servicos')html=`<section class="section"><div class="container"><span class="eyebrow">SERVIÇOS</span><h1>Soluções para sua empresa.</h1><div class="grid three">${serviceCards()}</div></div></section>`;else if(r==='login')html=login();else if(r==='plaquinhas')html=plates();else if(r==='studio')html=login();else if(bits[0]==='pagina')html=customPage(bits[1]);else if(bits[0]==='p')html=singlePlate(bits[1]);else if(bits.length===2&&state.companies[bits[1]])html=company(bits[0],bits[1]);else if(state.cities[r])html=city(r);else html=notFound();document.getElementById('app').innerHTML=html;document.documentElement.style.setProperty('--blue',state.theme.primary);document.documentElement.style.setProperty('--accent',state.theme.accent)}
function routePath(){const r=route();if(!r)return'home';if(r==='projeto')return'project';if(state.cities[r])return'cities.'+r;if(r.startsWith('pagina/')&&state.pages[r.slice(7)])return'pages.'+r.slice(7);if(r.split('/').length===2&&state.companies[r.split('/')[1]])return'companies.'+r.split('/')[1];return'home'}
function get(path){return path.split('.').reduce((a,k)=>a?.[k],state)}
function set(path,value){const parts=path.split('.');const last=parts.pop();const obj=parts.reduce((a,k)=>a?.[k],state);if(!obj)return;obj[last]=value;save();renderContent();document.getElementById('site-header').innerHTML=header();document.getElementById('site-footer').innerHTML=footer()}
function input(path,label,type='text',opts={}){const raw=get(path);const value=String(raw??'').trim()?raw:(opts.defaultValue??raw??'');let inp=type==='textarea'?`<textarea data-field="${esc(path)}" placeholder="${esc(opts.placeholder||'')}" rows="3">${esc(value)}</textarea>`:type==='image'?`<div class="image-editor">${value?`<img src="${esc(value)}" alt="Prévia de ${esc(label)}" class="image-preview">`:'<div class="image-empty">Nenhuma imagem selecionada — o padrão atual permanece ativo</div>'}<input type="file" accept="image/png,image/jpeg,image/webp" data-upload="${esc(path)}"><p class="small-helper">Enviar PNG, JPG ou WebP até 10 MB. A imagem será enviada quando você clicar em <strong>Salvar e publicar</strong>. Se houver falha, seu rascunho será mantido neste navegador.</p>${value?`<div class="minor-actions"><button type="button" data-action="clear-image" data-path="${esc(path)}">Remover imagem</button></div>`:''}</div>`:`<input data-field="${esc(path)}" type="${esc(type)}" value="${esc(value)}" placeholder="${esc(opts.placeholder||'')}">`;return `<div class="field"><label>${esc(label)}</label>${inp}</div>`}

function pageFields(){const path=routePath();let r=route(),title='Editar página atual',fields='';if(path==='home'){fields=input('home.tag','Texto de identificação')+input('home.title','Título principal')+input('home.emphasis','Título em destaque')+input('home.subtitle','Descrição','textarea')+input('home.photo','Imagem da capa — lado direito do início','image')+input('home.primaryLabel','Botão principal')+input('home.primaryUrl','Destino do botão principal')+input('home.secondaryLabel','Botão secundário')+input('home.secondaryUrl','Destino do botão secundário')}else if(path==='project'){fields=input('project.tag','Etiqueta')+input('project.title','Título')+input('project.emphasis','Texto em destaque')+input('project.subtitle','Descrição','textarea')+input('project.cover','Imagem do projeto','image')+input('project.primaryLabel','Texto do botão')}else if(path.startsWith('cities.')){fields=input(path+'.name','Nome da cidade')+input(path+'.tag','Identificação')+input(path+'.title','Título principal','textarea')+input(path+'.subtitle','Apresentação','textarea')+input(path+'.photo','Imagem principal da cidade','image')+`<h4 class="editor-section-title">Apresentação do patrocinador</h4><p class="small-helper">Modelo com três textos e imagem substituível em todas as cidades. Os textos demonstrativos aparecem automaticamente; personalize e clique em Salvar e publicar.</p>`+input(path+'.sponsor','Nome do patrocinador')+input(path+'.sponsorRole','Função / apresentação curta','text',{defaultValue:sponsorDefaults(state.cities[r]).role})+input(path+'.sponsorAbout','Sobre o patrocinador','textarea',{defaultValue:sponsorDefaults(state.cities[r]).about})+input(path+'.sponsorQuote','Mensagem do patrocinador','textarea',{defaultValue:sponsorDefaults(state.cities[r]).quote})+input(path+'.sponsorUrl','Link do patrocinador')+input(path+'.sponsorLogo','Foto ou logo do patrocinador','image')+input(path+'.sponsorImage','Banner do patrocinador','image')+`<h4 class="editor-section-title">Como funciona o projeto (opcional)</h4><p class="small-helper">Explique como participar e personalize as etapas. Se deixar vazio, esta seção ficará oculta.</p>`+input(path+'.howTitle','Título da explicação')+input(path+'.howText','Como funciona na cidade','textarea')+cityStepsFields(r)+cityExtraFields(r)+input(path+'.partnershipImage','Banner de realização e parceiros','image')}else if(path.startsWith('companies.')){fields=input(path+'.name','Nome da empresa')+input(path+'.category','Ramo de atuação')+input(path+'.tagline','Mensagem de avaliação')+input(path+'.photo','Logo','image')+input(path+'.google','Link Google Avaliações')+input(path+'.whatsapp','WhatsApp')+input(path+'.instagram','Instagram')+input(path+'.site','Website')}else if(path.startsWith('pages.')){fields=input(path+'.menu','Nome no menu')+input(path+'.tag','Identificação')+input(path+'.title','Título principal')+input(path+'.subtitle','Descrição','textarea')+input(path+'.photo','Foto / imagem principal','image')+input(path+'.button','Nome do botão')+input(path+'.buttonUrl','Link do botão')+input(path+'.sectionTitle','Título da segunda seção')+input(path+'.body','Texto da segunda seção','textarea')}else{title='Conteúdo de outras páginas';fields='<div class="mini-note">Abra a página inicial, a página do projeto, uma cidade, empresa ou página personalizada para editar os textos e imagens.</div>'}return `<h4>${title}</h4><p class="small-helper">Edite a página e clique em Publicar alterações para atualizar o site.</p>${fields}`}
function brandFields(){return `<h4>Identidade WillAI</h4>${input('brand.name','Nome da marca')+input('brand.tagline','Texto abaixo da marca')+input('brand.logo','Logo no cabeçalho','image')+input('brand.contact','Link comercial de orçamento')+input('brand.whatsapp','WhatsApp com DDD (link completo)')+input('brand.instagram','Instagram (link completo)')}<div class="field"><label>Azul principal</label><div class="color-row"><input type="color" data-color="theme.primary" value="${esc(state.theme.primary)}">${esc(state.theme.primary)}</div></div><div class="field"><label>Cor de destaque</label><div class="color-row"><input type="color" data-color="theme.accent" value="${esc(state.theme.accent)}">${esc(state.theme.accent)}</div></div><div class="mini-note">Você pode mudar as cores do site inteiro. Para voltar ao padrão original, use “Restaurar protótipo”.</div>`}
function portfolioFields(){return `<h4>Portfólio de trabalhos</h4><div class="mini-note">Inclua trabalhos e demonstrações. Você pode editar imagens, links, descrições e ocultar projetos temporariamente.</div>${(state.portfolio||[]).map((p,i)=>`<div class="edit-item"><strong>Projeto ${i+1}</strong>${input('portfolio.'+i+'.title','Título')}${input('portfolio.'+i+'.category','Categoria')}${input('portfolio.'+i+'.desc','Descrição','textarea')}${input('portfolio.'+i+'.image','Imagem','image')}${input('portfolio.'+i+'.url','Link público')}<label><input type="checkbox" data-portfolio-visible="${i}" ${p.visible!==false?'checked':''}> Visível no site</label><div class="minor-actions"><button data-action="delete-portfolio" data-index="${i}">Excluir</button></div></div>`).join('')}<div class="minor-actions"><button data-action="add-portfolio">Adicionar projeto</button><button data-action="publish-portal" class="btn btn-dark">Salvar projetos no Supabase</button></div>`}
function servicesFields(){return `<h4>Serviços e valores</h4><div class="mini-note">Edite serviços e preços e depois clique em Publicar alterações.</div><div class="edit-list">${state.services.map((s,i)=>`<div class="edit-item"><strong>Serviço ${i+1}</strong>${input('services.'+i+'.title','Título')+input('services.'+i+'.desc','Descrição','textarea')+input('services.'+i+'.price','Preço / condição')}<div class="minor-actions"><button data-action="delete-service" data-index="${i}">Excluir serviço</button></div></div>`).join('')}</div><div class="minor-actions"><button data-action="add-service">${icon('plus',16)} Adicionar serviço</button></div>`}
function citiesFields(){return `<h4>Cidades do projeto</h4><p class="small-helper">Selecione a cidade pelo menu superior para editar textos, banners e patrocínios.</p>${Object.entries(state.cities).map(([k,v])=>`<div class="edit-item" style="margin:12px 0"><strong>${esc(v.name)}</strong><a class="link-plain" href="#/${esc(k)}" data-close-editor="1">Abrir página ${icon('arrow',15)}</a></div>`).join('')}<div class="minor-actions"><button data-action="add-city">${icon('plus',16)} Nova cidade</button></div><p class="small-helper">Depois de criar, clique em <strong>Salvar e publicar</strong>. Para personalizar imagens e textos, abra a página e use a aba Página.</p>`}
function companiesFields(){return `<h4>Empresas publicadas</h4><p class="small-helper">As páginas das empresas são editadas no Studio original. Aqui você escolhe a cidade.</p>${Object.entries(state.companies).map(([slug,c])=>`<div class="edit-item"><strong>${esc(c.name)}</strong><p class="cap">/${esc(c.city)}/${esc(slug)}</p><div class="field"><label>Cidade</label><select data-company-city="${esc(slug)}">${Object.entries(state.cities).map(([city,obj])=>`<option value="${esc(city)}" ${c.city===city?'selected':''}>${esc(obj.name)}</option>`).join('')}</select></div></div>`).join('')}<a href="/studio/" class="btn btn-dark btn-small">Abrir editor de empresas</a>`}
function pagesFields(){return `<h4>Suas páginas personalizadas</h4><div class="mini-note">Crie novas páginas como campanhas, portfólios, bairros ou informações do projeto. Cada página tem seu próprio conteúdo, imagem e botão.</div>${Object.entries(state.pages).map(([k,p])=>`<div class="edit-item" style="margin:12px 0"><strong>${esc(p.title)}</strong><div class="cap">/pagina/${esc(k)}</div><div class="minor-actions"><button data-action="open-page" data-slug="${esc(k)}">Abrir página</button><button data-action="delete-page" data-slug="${esc(k)}">Excluir</button></div></div>`).join('')}<div class="minor-actions"><button data-action="add-page">${icon('plus',16)} Criar nova página</button></div>`}
function backupFields(){return `<h4>Salvar e transportar seu trabalho</h4><div class="mini-note"><strong>Como salvar:</strong> os campos mudam na prévia. Para disponibilizar suas alterações no site, clique em <strong>Salvar e publicar</strong>. Os dados são gravados no Supabase após confirmação. Você também pode exportar um backup JSON.</div><div class="minor-actions" style="margin-top:20px"><button data-action="export">${icon('download',16)} Baixar backup JSON</button><button data-action="import">Importar backup JSON</button></div><input type="file" accept="application/json,.json" id="backup-input" hidden><div class="minor-actions"><button data-action="reset">Restaurar protótipo original</button></div><p class="small-helper">A publicação exige seu login administrativo e uma conexão válida com o Supabase. Se ocorrer erro, leia a mensagem exibida no editor.</p>`}
function editor(){if(!ui.editor||!adminMode||!isAdmin)return '';const tabs=[['page','Página'],['brand','Identidade'],['services','Serviços'],['portfolio','Portfólio'],['cities','Cidades'],['companies','Empresas'],['pages','Novas páginas'],['backup','Backup']];const bodies={page:pageFields,brand:brandFields,services:servicesFields,portfolio:portfolioFields,cities:citiesFields,companies:companiesFields,pages:pagesFields,backup:backupFields};return `<div class="editor-shade" data-action="close-editor"></div><aside class="editor" aria-label="Editor de conteúdo" role="dialog"><div class="editor-top"><div class="editor-topline"><div><small style="color:#9cdbea">WILLAI STUDIO • EDIÇÃO</small><h3>Editor visual</h3></div><button data-action="close-editor" class="icon-btn" title="Fechar editor">${icon('close',19)}</button></div><p style="font-size:12px;color:#c5deef;margin:8px 0 0">Personalize a página sem editar códigos.</p></div><div class="editor-tabs">${tabs.map(([k,v])=>`<button data-tab="${k}" class="${ui.tab===k?'sel':''}">${v}</button>`).join('')}</div><div class="editor-body">${(bodies[ui.tab]||pageFields)()}</div><div class="editor-footer"><div class="editor-quick"><button type="button" data-action="open-home-edit">Início / Capa</button><button type="button" data-action="open-project-edit">Projeto</button><button type="button" data-action="open-portfolio-edit">Portfólio</button><button type="button" data-action="open-cities-edit">Cidades</button></div><div id="editorSaveStatus" role="status" aria-live="polite" class="editor-save-status">${ui.dirty?'● Há alterações não publicadas. Clique em Salvar e publicar.':'Tudo pronto para editar. Clique em Salvar e publicar ao concluir.'}</div><button type="button" data-action="publish-portal" class="strong editor-save">Salvar e publicar ✓</button><a class="editor-visit-site" href="/" target="_blank" rel="noopener noreferrer">Visualizar site público</a><button type="button" data-action="export">Backup JSON</button><button type="button" data-action="close-editor">Fechar</button></div></aside>`}
function render(){document.getElementById('site-header').innerHTML=header();renderContent();document.getElementById('site-footer').innerHTML=footer();document.getElementById('editor-root').innerHTML=editor();if(!adminMode){document.querySelectorAll('a[href^="#/"]').forEach(a=>a.setAttribute('href','/'+a.getAttribute('href').slice(2)))}}
const portalPublicRoutes=new Set(['','projeto','servicos','portfolio','sobre','contato','login','plaquinhas']);
function isPortalNavigation(href){
 try{
  const u=new URL(href,location.href);
  if(u.origin!==location.origin||u.search||u.hash)return false;
  const bits=u.pathname.split('/').filter(Boolean),first=bits[0]||'';
  if(bits.length===0)return true;
  if(bits.length===1)return portalPublicRoutes.has(first)||Boolean(state.cities[first]);
  return bits.length===2&&first==='pagina'&&Boolean(state.pages[bits[1]]);
 }catch{return false}
}
function navigatePortal(href,pop=false){
 const u=new URL(href,location.href);
 if(!pop&&u.pathname===location.pathname){if(ui.menu){ui.menu=false;document.getElementById('site-header').innerHTML=header()}return;}
 if(!pop)history.pushState({portal:true},'',u.pathname);
 ui.menu=false;
 render();
 window.scrollTo({top:0,behavior:'instant'});
 try{const main=document.getElementById('app');main?.setAttribute('tabindex','-1')}catch{}
}
document.addEventListener('click',e=>{
 if(adminMode||e.defaultPrevented||e.button!==0||e.ctrlKey||e.metaKey||e.shiftKey||e.altKey)return;
 const a=e.target.closest('a[href]');
 if(!a||a.hasAttribute('download')||(a.target&&a.target!=='_self'))return;
 const href=a.getAttribute('href');
 if(!href||href.startsWith('#')||!isPortalNavigation(href))return;
 e.preventDefault();navigatePortal(href);
});
window.addEventListener('popstate',()=>{if(!adminMode&&isPortalNavigation(location.href))navigatePortal(location.href,true)});
function refreshEditor(){document.getElementById('editor-root').innerHTML=editor()}
function fileDownload(content,name,mime){const blob=new Blob([content],{type:mime||'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function slugify(x){return String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50)}
function addCity(){const name=prompt('Nome da nova cidade:');if(!name)return;const slug=slugify(name);if(!slug||state.cities[slug]){toast('Essa cidade já existe ou o nome é inválido.');return}state.cities[slug]={name,tag:'PROJETO DE INCLUSÃO DIGITAL',title:`Conheça o projeto em ${name}.`,subtitle:'Apresentação e oportunidades digitais da cidade.',photo:'',sponsor:'',sponsorRole:sponsorDefaults({name}).role,sponsorAbout:sponsorDefaults({name}).about,sponsorQuote:sponsorDefaults({name}).quote,sponsorLogo:'',sponsorUrl:'',sponsorImage:'',partnershipImage:''};save();ui.editor=false;location.hash='#/'+slug;toast('Cidade criada! Personalize e clique em Salvar e publicar.')}
function addCompany(){const name=prompt('Nome do estabelecimento:');if(!name)return;const cityName=prompt('Cidade (slug, ex.: curitiba):','curitiba');const city=slugify(cityName||'curitiba');if(!state.cities[city]){toast('Cadastre a cidade primeiro.');return}const slug=slugify(name);if(!slug||state.companies[slug]){toast('Empresa já existente ou nome inválido.');return}state.companies[slug]={slug,city,name,category:'Categoria da empresa',tagline:'Sua opinião faz a diferença!',photo:'',google:'',whatsapp:'',instagram:'',site:''};save();ui.editor=false;location.hash='#/'+city+'/'+slug;toast('Empresa adicionada à prévia.')}
function addPage(){const name=prompt('Título da nova página:');if(!name)return;const slug=slugify(name);if(!slug||state.pages[slug]){toast('Essa página já existe ou o nome é inválido.');return}state.pages[slug]={menu:name,tag:'WILLAI • NOVA PÁGINA',title:name,subtitle:'Escreva aqui a apresentação da sua nova página.',photo:'',button:'Conheça mais',buttonUrl:'#/login',sectionTitle:'Sobre',body:'Edite este conteúdo no painel visual.'};save();ui.editor=false;location.hash='#/pagina/'+slug;toast('Página criada! Personalize e clique em Salvar e publicar.')}
function createPlate(){const code=Array.from(crypto.getRandomValues(new Uint8Array(7))).map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase();state.plaques.push({code,status:'available',url:''});save();render();toast('Código criado APENAS nesta prévia local.')}
function editPlate(i){let p=state.plaques[i];if(!p)return;const url=prompt('Link de destino da plaquinha (https://...), ou deixe vazio para estoque:',p.url||'');if(url===null)return;if(url&&(!/^https:\/\//i.test(url)||url.length>2000)){toast('Use uma URL HTTPS válida.');return}p.url=url;p.status=url?'active':'available';save();render();toast('Destino atualizado no protótipo local.')}
function uploadImage(file,path){if(!file)return;if(!/^image\/(png|jpeg|webp)$/.test(file.type)){toast('Envie PNG, JPG ou WebP.');return}if(file.size>15*1024*1024){toast('Imagem muito grande. Utilize até 15 MB.');return}const fr=new FileReader();fr.onload=()=>{const image=new Image();image.onload=()=>{const cap=1500,k=Math.min(1,cap/Math.max(image.width,image.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(image.width*k));c.height=Math.max(1,Math.round(image.height*k));c.getContext('2d').drawImage(image,0,0,c.width,c.height);set(path,c.toDataURL('image/webp',.84));refreshEditor();render();toast('Prévia da imagem atualizada. Clique em Salvar e publicar.');};image.onerror=()=>toast('Não foi possível ler a imagem.');image.src=fr.result};fr.readAsDataURL(file)}
function reset(){if(!confirm('Restaurar a prévia? Todas as edições locais serão perdidas. Faça um backup se quiser preservar.'))return;state=structuredClone(seed);save();render();toast('Protótipo restaurado.')}
document.addEventListener('click',e=>{const jump=e.target.closest('a[href="#servicos"],a[href="#cidades"],a[href="#empresas"]');if(jump){e.preventDefault();document.getElementById(jump.getAttribute('href').slice(1))?.scrollIntoView({behavior:'smooth'});return}const tab=e.target.closest('[data-tab]');if(tab){ui.tab=tab.dataset.tab;refreshEditor();return}const close=e.target.closest('[data-close-editor]');if(close){ui.editor=false;render();return}const btn=e.target.closest('[data-action]');if(!btn){const ext=e.target.closest('[data-external]');if(ext){const u=ext.dataset.external;if(/^https:\/\//i.test(u))window.open(u,'_blank','noopener,noreferrer');}return;}let action=btn.dataset.action;if(action==='open-home-edit'){ui.tab='page';location.hash='#/';ui.editor=true;render()}else if(action==='open-project-edit'){ui.tab='page';location.hash='#/projeto';ui.editor=true;render()}else if(action==='open-portfolio-edit'){ui.tab='portfolio';refreshEditor()}else if(action==='open-cities-edit'){ui.tab='cities';refreshEditor()}else if(action==='edit'&&adminMode&&isAdmin){ui.editor=!ui.editor;ui.tab='page';render()}else if(action==='close-editor'){ui.editor=false;render()}else if(action==='menu'){ui.menu=!ui.menu;document.getElementById('site-header').innerHTML=header()}else if(action==='add-portfolio'){state.portfolio||=[];state.portfolio.push({id:randomId(),title:'Novo projeto',category:'Portfólio',desc:'Descrição da solução.',image:'',url:'',visible:true});save();render();refreshEditor()}else if(action==='delete-portfolio'){if(confirm('Excluir este projeto?')){state.portfolio.splice(Number(btn.dataset.index),1);save();render()}}else if(action==='add-service'){state.services.push({id:randomId(),title:'Novo serviço',desc:'Descrição do serviço oferecido pela WillAI.',price:'Sob orçamento',icon:'sparkles'});save();render();refreshEditor()}else if(action==='delete-service'){state.services.splice(Number(btn.dataset.index),1);save();render()}else if(action==='add-city-step'){const city=state.cities[btn.dataset.city];if(!city)return;city.howSteps||=[];city.howSteps.push({title:'',body:''});save();refreshEditor()}else if(action==='delete-city-step'){const city=state.cities[btn.dataset.city];if(city?.howSteps){city.howSteps.splice(Number(btn.dataset.index),1);save();render();refreshEditor()}}else if(action==='add-city-section'){const city=state.cities[btn.dataset.city];if(!city)return;city.extraSections||=[];city.extraSections.push({title:'',body:''});save();refreshEditor()}else if(action==='delete-city-section'){const city=state.cities[btn.dataset.city];if(city?.extraSections){city.extraSections.splice(Number(btn.dataset.index),1);save();render();refreshEditor()}}else if(action==='add-city')addCity();else if(action==='add-company')addCompany();else if(action==='add-page')addPage();else if(action==='delete-page'){if(confirm('Excluir esta página personalizada?')){delete state.pages[btn.dataset.slug];save();render()}}else if(action==='open-page'){ui.editor=false;location.hash='#/pagina/'+btn.dataset.slug}else if(action==='publish-portal')publishPortal();else if(action==='export'){fileDownload(JSON.stringify(state,null,2),'willai-portal-backup.json','application/json');toast('Backup gerado.') }else if(action==='import'){document.getElementById('backup-input')?.click()}else if(action==='clear-image'){set(btn.dataset.path,'');refreshEditor();render()}});
document.addEventListener('change',e=>{if(e.target.matches('[data-portfolio-visible]')){const index=Number(e.target.dataset.portfolioVisible);if(state.portfolio?.[index]){state.portfolio[index].visible=e.target.checked;save();render()}return}if(e.target.matches('[data-company-city]')){const slug=e.target.dataset.companyCity;state.companyCities[slug]=e.target.value;if(state.companies[slug])state.companies[slug].city=e.target.value;save();refreshEditor();return}if(e.target.matches('[data-field]')){set(e.target.dataset.field,e.target.value);return}if(e.target.matches('[data-color]')){set(e.target.dataset.color,e.target.value);refreshEditor();render();return}if(e.target.matches('[data-upload]')){uploadImage(e.target.files?.[0],e.target.dataset.upload);return}if(e.target.id==='backup-input'){const file=e.target.files?.[0];if(!file)return;const fr=new FileReader();fr.onload=()=>{try{const obj=JSON.parse(fr.result);if(!obj.home||!obj.cities||!Array.isArray(obj.services)||!obj.pages||!obj.companies)throw Error('Estrutura incompatível');if(!confirm('Importar backup? Isso substitui as configurações locais desta prévia.'))return;state=obj;save();render();toast('Backup carregado!')}catch{toast('Arquivo JSON inválido ou incompatível.')}};fr.readAsText(file)}});
window.addEventListener('hashchange',()=>{if(adminMode){ui.menu=false;render();window.scrollTo(0,0)}}); 
async function request(path,opts={},credentials=auth){
 const token=credentials?.access_token||null;
 const makeHeaders=authorization=>({apikey:cfg.publishableKey,Accept:'application/json','Content-Type':'application/json',
 ...(authorization?{Authorization:'Bearer '+authorization}:{}),...opts.headers});
 let res=await fetch(cfg.url+path,{...opts,headers:makeHeaders(token)});
 // Caso o token tenha expirado, renovar uma vez; nunca renovar em uma chamada de login/refresh.
 if(res.status===401&&credentials===auth&&auth?.refresh_token&&!path.startsWith('/auth/v1/token')){
   try{const renewed=await fetch(cfg.url+'/auth/v1/token?grant_type=refresh_token',{
    method:'POST',headers:{apikey:cfg.publishableKey,'Content-Type':'application/json'},
    body:JSON.stringify({refresh_token:auth.refresh_token})
   });
   if(renewed.ok){auth=await renewed.json();sessionStorage.setItem(tokenKey,JSON.stringify(auth));
    res=await fetch(cfg.url+path,{...opts,headers:makeHeaders(auth.access_token)})}
   }catch(e){console.warn('Renovação de sessão falhou',e)}
 }
 if(!res.ok){let error;try{error=await res.json()}catch{}
   throw Error(error?.message||error?.error_description||error?.error||('HTTP '+res.status+' ao comunicar com o Supabase'))}
 if(res.status===204)return null;
 const body=await res.text();return body?JSON.parse(body):null;
}
async function checkAccessRole(){try{if(!auth?.access_token)return false;const rows=await request('/rest/v1/willai_access_roles?select=role&limit=1');return Array.isArray(rows)&&rows.length>0}catch{return false}}
async function checkAdmin(){try{if(!auth?.access_token)return false;const rows=await request('/rest/v1/willai_portal_admins?select=user_id&limit=1');return Array.isArray(rows)&&rows.length>0}catch{return false}}
const publicCacheKey='willai_portal_public_cache_v1';
function restorePublicCache(){
 try{const record=JSON.parse(sessionStorage.getItem(publicCacheKey)||'null');
 if(record&&Date.now()-record.savedAt<30000&&record.config&&typeof record.config==='object')
 state={...state,...record.config,portfolio:record.config.portfolio||state.portfolio};}catch(e){}
}
function cachePublicConfig(config){
 try{const data=JSON.stringify({savedAt:Date.now(),config});
 if(data.length<450000)sessionStorage.setItem(publicCacheKey,data);}catch(e){}
}
async function loadPublic(){
 const [portal,pages]=await Promise.allSettled([
  request('/rest/v1/willai_portal_content?slug=eq.main&published=eq.true&select=config&limit=1',{cache:'no-store'}),
  request('/rest/v1/willai_pages?published=eq.true&select=slug,name,config&limit=1000')
 ]);
 if(portal.status==='fulfilled'){
  const config=portal.value?.[0]?.config;
  if(config&&typeof config==='object'){state={...state,...config,portfolio:config.portfolio||state.portfolio};cachePublicConfig(config)}
 }else console.warn('Portal: não foi possível atualizar dados',portal.reason);
 state.companyCities||={};
 if(pages.status==='fulfilled'&&Array.isArray(pages.value)){
  const companies={};
  for(const p of pages.value){const d=p.config||{},city=state.companyCities[p.slug]||d.city||'curitiba';
   if(!state.cities[city])continue;
   companies[p.slug]={slug:p.slug,city,name:p.name,photo:d.logo||d.photo||'',
   category:d.category||'Empresa participante',google:d.google||'',whatsapp:d.whatsapp||'',
   instagram:d.instagram||'',site:d.site||'',tagline:'Sua opinião faz a diferença!'};
  }
  state.companies=companies;
 }else if(pages.status==='rejected')console.warn('Empresas indisponíveis',pages.reason);
}
async function uploadData(url){
 const m=/^data:image\/(png|jpeg|webp);base64,(.*)$/s.exec(url);
 if(!m)return url;
 if(!auth?.user?.id)throw Error('Sua sessão expirou. Saia e entre novamente antes de publicar imagens.');
 if(!cfg.bucket)throw Error('O armazenamento das imagens ainda não foi configurado.');
 const bin=atob(m[2]),arr=new Uint8Array(bin.length);
 for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
 if(arr.length>10*1024*1024)throw Error('Imagem acima de 10 MB. Comprima o arquivo.');
 const path=auth.user.id+'/portal/'+crypto.randomUUID()+'.'+(m[1]==='jpeg'?'jpg':m[1]);
 const res=await fetch(cfg.url+'/storage/v1/object/'+cfg.bucket+'/'+path,{
  method:'POST',headers:{apikey:cfg.publishableKey,Authorization:'Bearer '+auth.access_token,
  'Content-Type':'image/'+m[1],'x-upsert':'false'},body:arr});
 if(!res.ok){let err={};try{err=await res.json()}catch{}
  throw Error('O Supabase não aceitou a imagem: '+(err.message||err.error||'HTTP '+res.status)+'. Confira Storage > willai-public e a política de uploads.')}
 return cfg.url+'/storage/v1/object/public/'+cfg.bucket+'/'+path;
}
async function replaceMedia(v){if(typeof v==='string')return uploadData(v);if(Array.isArray(v))return Promise.all(v.map(replaceMedia));if(v&&typeof v==='object'){const e=await Promise.all(Object.entries(v).map(async ([k,x])=>[k,await replaceMedia(x)]));return Object.fromEntries(e)}return v}
async function ensureEditorSession(){
 if(!auth?.refresh_token)throw Error('Sessão não encontrada. Entre novamente no painel.');
 // Sempre renova a sessão antes de uma publicação importante.
 // O token anterior pode ter expirado mesmo sem campo expires_at.
 const renewed=await request('/auth/v1/token?grant_type=refresh_token',{
  method:'POST',body:JSON.stringify({refresh_token:auth.refresh_token})
 },null);
 if(!renewed?.access_token||!renewed?.user?.id)throw Error('Não foi possível renovar seu login. Entre novamente.');
 auth=renewed;sessionStorage.setItem(tokenKey,JSON.stringify(auth));
}
async function publishPortal(){
 if(!adminMode||!isAdmin){toast('Acesso negado');return}
 const b=document.querySelector('[data-action="publish-portal"]'),indicator=document.getElementById('editorSaveStatus');
 if(b?.disabled)return;
 if(b){b.disabled=true;b.textContent='Salvando…'}
 if(indicator)indicator.textContent='Gravando alterações no Supabase…';
 try{
   await ensureEditorSession();
   const data=await replaceMedia(structuredClone(state));
   const rows=await request('/rest/v1/willai_portal_content?slug=eq.main',{
      method:'PATCH',headers:{Prefer:'return=representation'},
      body:JSON.stringify({config:data,updated_at:new Date().toISOString()})
   });
   if(!Array.isArray(rows)||!rows.length)throw Error('O banco não confirmou a gravação. Confira suas permissões.');
   // Confirmar o conteúdo gravado, e não apenas o retorno HTTP do PATCH.
   const check=await request('/rest/v1/willai_portal_content?slug=eq.main&published=eq.true&select=config&limit=1',{cache:'no-store'});
   const saved=check?.[0]?.config;
   if(!saved)throw Error('A publicação não pôde ser verificada: conteúdo público indisponível.');
   for(const [cityId,cityData] of Object.entries(data.cities||{})){
     const publishedCity=saved.cities?.[cityId];
     if(!publishedCity)throw Error('A cidade '+cityId+' não apareceu no conteúdo publicado.');
     for(const key of ['sponsor','sponsorRole','sponsorAbout','sponsorQuote','sponsorUrl','sponsorLogo','sponsorImage','howTitle','howText']){
       if((publishedCity[key]??'')!==(cityData[key]??'')){
         throw Error('A informação '+key+' de '+cityId+' não corresponde ao texto publicado. Suas alterações permanecem no rascunho.');
       }
     }
   }
   state=saved;cachePublicConfig(saved);clearAdminDraft();
   try{localStorage.setItem('willai_portal_updated_at',String(Date.now()))}catch(e){}
   ui.editor=true;render();
   const success=document.getElementById('editorSaveStatus');
   if(success)success.textContent='✓ Alterações publicadas! Abra o site público para conferir.';
   toast('✓ Projeto salvo e publicado no Supabase!');
 }catch(err){
   const message=err?.message||String(err);
   if(indicator)indicator.textContent='✕ Publicação não realizada: '+message+' | Seu rascunho foi preservado neste dispositivo.';
   toast('Não foi possível publicar: '+message);
   console.error('WillAI publicação',err);
 }finally{
   const btn=document.querySelector('[data-action="publish-portal"]');
   if(btn){btn.disabled=false;btn.textContent='Salvar e publicar ✓'}
 }
}

document.addEventListener('submit',async e=>{if(e.target.id!=='portal-login-form')return;e.preventDefault();const status=document.getElementById('portalLoginStatus');status.textContent='Validando...';try{const email=document.getElementById('portalEmail').value,password=document.getElementById('portalPassword').value;const result=await request('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})},null);auth=result;if(!(await checkAdmin())&&!(await checkAccessRole()))throw Error('Seu usuário não está autorizado para acessar o painel');sessionStorage.setItem(tokenKey,JSON.stringify(result));location.href='/studio/gestao/'}catch(e){status.textContent=e.message}});
(async()=>{
 if(!adminMode){
  restorePublicCache();
  render();
  loadPublic().then(()=>render()).catch(e=>console.warn('Falha na atualização pública',e));
  // Se o editor publicar em outra aba, atualiza automaticamente esta visualização.
  window.addEventListener('storage',e=>{
    if(e.key==='willai_portal_updated_at'){
      loadPublic().then(()=>render()).catch(err=>console.warn('Falha ao atualizar conteúdo publicado',err));
    }
  });
  return;
 }
 await loadPublic();
 try{auth=JSON.parse(sessionStorage.getItem(tokenKey)||'null')}catch{}
 isAdmin=await checkAdmin();
 if(!isAdmin){
  state=structuredClone(seed);
  document.getElementById('site-header').innerHTML='';
  document.getElementById('site-footer').innerHTML='';
  document.getElementById('app').innerHTML=login();
  return;
 }
 const recoveredDraft=restoreAdminDraft();
 const initialTab=new URLSearchParams(location.search).get('edit');if(['page','cities','portfolio','services','brand','pages'].includes(initialTab)){ui.tab=initialTab;ui.editor=true;}else ui.editor=false;render();
 if(recoveredDraft){toast('Rascunho anterior recuperado. Clique em Salvar e publicar para finalizar.')}
})();
})();
