name: QR Premium checks
on:
  pull_request:
    paths:
      - 'qr/**'
      - 'sql/20261028_willai_qr_premium_publicacao.sql'
      - 'tests/qr-premium.test.cjs'
      - '.github/workflows/qr-premium.yml'
  push:
    branches:
      - 'feat/qr-premium-fullscreen-20261028'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and integration contract tests
        run: node --test tests/qr-premium.test.cjs
